name: aegis-database-dev
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${AEGIS_MYSQL_ROOT_PASSWORD:?Set AEGIS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: aegis
      MYSQL_USER: aegis_app
      MYSQL_PASSWORD: ${AEGIS_MYSQL_PASSWORD:?Set AEGIS_MYSQL_PASSWORD}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:${AEGIS_MYSQL_PORT:-3307}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER -D aegis -e 'SELECT 1 FROM roles LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: aegis_root
      MONGO_INITDB_ROOT_PASSWORD: ${AEGIS_MONGO_ROOT_PASSWORD:?Set AEGIS_MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: aegis
      AEGIS_MONGO_PASSWORD: ${AEGIS_MONGO_PASSWORD:?Set AEGIS_MONGO_PASSWORD}
    ports: ["127.0.0.1:${AEGIS_MONGO_PORT:-27018}:27017"]
    volumes:
      - mongo_data:/data/db
      - ./mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u aegis_app -p \"$$AEGIS_MONGO_PASSWORD\" --authenticationDatabase aegis aegis --eval 'quit(db.getCollectionNames().length === 3 ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
  mongo_data:
