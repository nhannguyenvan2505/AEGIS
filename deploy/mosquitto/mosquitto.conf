# TLS only, no anonymous clients. Certificates and passwords: deploy/mqtt.sh.
persistence false
log_dest stdout

listener 8883
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/acl
