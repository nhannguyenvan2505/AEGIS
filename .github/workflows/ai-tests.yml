---
name: AI tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-tests:
    # CPU only, no model weights: these tests use fake detectors and gatekeepers.
    # They check the service contract, not model accuracy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai_service/api/requirements.txt
      # Installed first from the CPU index; otherwise ultralytics pulls the much larger CUDA build.
      # Versions follow the workstation that produced the released models (torch 2.11.0).
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install AI service requirements
        run: python -m pip install -r ai_service/api/requirements.txt
      # The tests replace the models, so import the real libraries once to catch a broken install.
      - name: Check the inference libraries import
        run: python -c "import torch, torchvision, ultralytics, PIL; print(torch.__version__, ultralytics.__version__, PIL.__version__)"
      - name: Run AI service tests
        run: python -B -m unittest discover -s ai_service/api/checks -p 'test_*.py'
      - name: Run training script tests
        if: success() || failure()
        run: python -B -m unittest discover -s ai_service/training -p 'test_*.py'
